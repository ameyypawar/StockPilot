<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Offline - StockPilot</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #F8FAFC;
    color: #1E293B;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #FFFFFF;
    border-radius: 12px;
    padding: 32px 28px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    text-align: center;
  }
  .brand { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .brand span { color: #0D9488; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #64748B; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  .links a {
    display: block;
    padding: 12px 16px;
    border-radius: 8px;
    background-color: #0D9488;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  .links a:hover { background-color: #0B7A70; }
  .note { margin-top: 20px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Stock<span>Pilot</span></div>
    <h1>You're offline</h1>
    <p>No connection right now. Pages and data you've already opened are still available below.</p>
    <div class="links">
      <a href="/Pwa/Search">Product Search</a>
      <a href="/Pwa/Stock">Stock Overview</a>
      <a href="/Pwa/LowStock">Low Stock Alerts</a>
    </div>
    <p class="note">This page will reconnect automatically once you're back online.</p>
  </div>
</body>
</html>
